template:
  name: lre-trigger
  identifier: lretrigger
  versionLabel: v1
  type: Step
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  spec:
    timeout: 50m
    type: ShellScript
    spec:
      shell: Bash
      executionTarget: {}
      delegateSelectors: []
      source:
        type: Inline
        spec:
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            log_info() { echo -e "[INFO] $*"; }
            log_error() { echo -e "[ERROR] $*" >&2; }
            log_warn() { echo -e "[WARN] $*"; }

            # --------- Ensure jq is available ----------
            if ! command -v jq >/dev/null 2>&1; then
              log_info "jq not found, attempting to install…"

              install_jq_pm() {
                if command -v apt-get >/dev/null 2>&1; then
                  apt-get update && apt-get install -y jq
                elif command -v yum >/dev/null 2>&1; then
                  yum install -y jq
                elif command -v apk >/dev/null 2>&1; then
                  apk add --no-cache jq
                else
                  return 1
                fi
              }

              install_jq_binary() {
                mkdir -p "$HOME/.local/bin"
                curl -fL https://app.harness.io/public/shared/tools/chaos/offline-installer/linux/jq-linux64 -o "$HOME/.local/bin/jq"
                chmod +x "$HOME/.local/bin/jq"
                export PATH="$HOME/.local/bin:$PATH"
              }

              if install_jq_pm; then
                log_info "jq installed via package manager ($(jq --version))"
              elif install_jq_binary; then
                log_info "jq downloaded to ~/.local/bin and available ($(jq --version))"
              else
                log_error "Failed to install jq. Please install it manually and re-run."
                exit 1
              fi
            else
              log_info "jq is already installed ($(jq --version))"
            fi

            # --------- LoadRunner authentication and test trigger ----------

            log_info "Authenticating to LoadRunner…"

            curl -k "$LRE_URL/loadtest/rest/authentication-point/authenticate" \
              -H "accept: application/json, text/plain, */*" \
              -H "content-type: application/json" \
              -H "Authorization: Bearer $LRE_TOKEN" \
              -c cookies.txt


            log_info "Log In to Project $LRE_PROJECT"
            curl -k "$LRE_URL/loadtest/rest-pcweb/login/LoginToProject?domain=$LRE_DOMAIN&project=$LRE_PROJECT" \
              -b cookies.txt -c cookiesa.txt \
              -H "accept: application/json, text/plain, */*"
            log_info "Logged in to project…"


            log_info "Triggering LoadRunner test…"


            start_run_response=$(curl -sk -b cookiesa.txt \
              -H "content-type: application/json" \
              --data-raw "{\"DurationInMinutes\":$DurationInMinutes,\"IsUseVuds\":$IsUseVuds,\"VudsAmount\":$VudsAmount,\"IsNewReservationMode\":$IsNewReservationMode,\"PostRunAction\":$PostRunAction,\"TestInstanceId\":$LRE_TEST_INSTANCE_ID,\"ReservationId\":$ReservationId}" \
              -X POST "$LRE_URL/loadtest/rest-pcweb/designLoadtest/StartRun?testId=$LRE_TEST_ID")

            echo $start_run_response

            #run_id=$(echo "$start_run_response" | grep -oPm1 '(?<=<RunId>)[^<]+')
            run_id=$(echo "$start_run_response" | grep -oPm1 '(?<=<QcRunId>)[^<]+')
            echo $run_id



            if [ -z "$run_id" ] || [ "$run_id" == "null" ]; then
              log_error "Run ID not found in response"
              exit 1
            fi

            log_info "Test started successfully. Run Id: $run_id"

            # --------- Monitoring & Report Download ----------
            if [[ "${MONITORING_ENABLED:-false}" == "true" ]]; then
              log_info "Monitoring is enabled. Starting status polling…"
              
              curl -k  -b /tmp/cookiesa.txt "$LRE_URL/loadtest/rest/domains/$LRE_DOMAIN/projects/$LRE_PROJECT/Runs/$run_id"


              while true; do
                status_response=$(curl -sk -b /tmp/cookiesa.txt \
                  "$LRE_URL/loadtest/rest/domains/$LRE_DOMAIN/projects/$LRE_PROJECT/Runs/$run_id")

                # status=$(echo "$status_response" | grep -oP '(?<=<RunState>).*?(?=</RunState>)')
                # echo "Current run status: $status"

                # if [[ "$status" == "Finished" || "$status" == "Failed" || "$status" == "Aborted" ]]; then
                #   log_info "Test completed with status: $status"
                #   break
                # fi
                # sleep 10
              status=$(echo "$status_response" | grep -oP '(?<=<RunState>).*?(?=</RunState>)')
              echo "Current run status: $status"

              case "$status" in
                Finished|RunFailure|Canceled|Aborted)
                  echo "✅ Test completed with status: $status"
                  break
                  ;;
                *)
                  sleep 10
                  ;;
              esac
              done

              # log_info "Downloading test report…"

              # if curl -sf -b /tmp/cookiesa.txt \
              #   "$LRE_URL/loadtest/rest-pcweb/RunReport/DownloadPDF?runId=$run_id" \
              #   -o "LoadTest_Run_${run_id}.html"; then
              #   log_info "Report saved as LoadTest_Run_${run_id}.html"
              #   cat LoadTest_Run_${run_id}.html | less

              # else
              #   log_error "Failed to download test report"
              # fi
            else
              log_warn "Monitoring is disabled. Skipping status polling and report download."
            fi
      environmentVariables:
        - name: LRE_URL
          type: String
          value: <+input>
        - name: LRE_TOKEN
          type: Secret
          value: <+input>
        - name: LRE_DOMAIN
          type: String
          value: <+input>
        - name: LRE_PROJECT
          type: String
          value: <+input>
        - name: LRE_TEST_ID
          type: String
          value: <+input>
        - name: LRE_TEST_INSTANCE_ID
          type: String
          value: <+input>
        - name: MONITORING_ENABLED
          type: String
          value: <+input>.default(false)
        - name: DurationInMinutes
          type: String
          value: <+input>.default(5)
        - name: IsUseVuds
          type: String
          value: <+input>.default(false)
        - name: VudsAmount
          type: String
          value: <+input>.default(0)
        - name: IsNewReservationMode
          type: String
          value: <+input>.default(true)
        - name: PostRunAction
          type: String
          value: <+input>.default(2)
        - name: ReservationId
          type: String
          value: <+input>.default(-1)
      outputVariables: []
